name: Daily Song Update

on:
  schedule:
    - cron: '0 9 * * *' # Runs every day at 9 AM UTC
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: Allows the bot to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install google-api-python-client google-generativeai pyyaml

      - name: Run Fetch Script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_songs.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'BinTere Bot'
          git config --global user.email 'bot@bintere.com'
          git add content/posts/
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Added new songs [skip ci]" && git push)
