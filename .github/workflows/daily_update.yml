name: Daily Content & Deploy

on:
  schedule:
    - cron: '0 9 * * *' # Runs every day at 9 AM UTC
  workflow_dispatch: # Allows manual run
  push:
    branches: ["main"] # Also runs when YOU push changes manually

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # JOB 1: FETCH SONGS & UPDATE REPO
  update-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12' # Changed to 3.11 for Google tools

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Fetch Script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_songs.py

      - name: Commit and Push new content
        run: |
          git config --global user.name 'BinTere Bot'
          git config --global user.email 'bot@bintere.com'
          git add content/
          # Only commit if changes exist
          if [[ -n $(git status -s) ]]; then
            git commit -m "🤖 Daily Update: Added new content"
            git push
          else
            echo "No changes to commit."
          fi

  # JOB 2: BUILD HUGO & DEPLOY TO PAGES
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-content # Waits for Job 1 to finish
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive 
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
